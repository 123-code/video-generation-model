dataset_params:

  video_path: 'data/hmdb51'  # Update this to where your folder is

  video_ext: 'avi'           # HMDB51 is usually .avi

  num_images_train: 0        # Set to 0 initially to test video only, or 8 for joint training

  frame_height: 256          # SD VAE works best with 256 or 512

  frame_width: 256

  frame_channels: 3

  num_frames: 16             # Model setting (used during training, irrelevant for processing here)

  frame_interval: 3          # Model setting

  centre_square_crop: True   # Good for square inputs

  video_filter_path: null    # Process all videos

  ae_frame_sample_prob: 0.1  # Irrelevant here as we skip AE training



diffusion_params:

  num_timesteps: 1000

  beta_start: 0.0001

  beta_end: 0.02



ditv_params:

  patch_size: 2

  num_layers: 12 # Latte-B configuration (roughly)

  hidden_size: 768

  num_heads: 12

  head_dim: 64

  timestep_emb_dim: 256



# Important: These params must match SD VAE output

autoencoder_params:

  z_channels: 4  # SD VAE has 4 channels

  # The rest below are ignored since we aren't training the VAE

  codebook_size: 8192 

  down_channels: [128, 256, 512, 512]

  mid_channels: [512]

  down_sample: [True, True, True]

  attn_down: [False, False, False]

  norm_channels: 32

  num_heads: 4

  num_down_layers: 2

  num_mid_layers: 2

  num_up_layers: 2



train_params:

  seed: 42

  task_name: 'hmdb51_sd_latte'

  # ... (keep other params from ucf.yaml) ...

  save_video_latent_dir: 'video_latents'

  vae_autoencoder_ckpt_name: 'vae_autoencoder_ckpt.pth' # Will be ignored by our script. then calculate and save the latents from data/hmdb51 using the stable diffusion vae


